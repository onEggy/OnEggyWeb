<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar with Animated Hamburger Menu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            transition: filter 0.3s; /* Add transition for blur effect */
        }

        .container {
            display: flex;
        }

        .hamburger-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2;
            cursor: pointer;
        }

        .hamburger {
            padding: 10px;
            background-color: #333;
            border-radius: 50%; /* Make it a circular button */
        }

        .hamburger div {
            width: 30px;
            height: 3px;
            background-color: #fff;
            margin: 6px 0;
            transition: 0.4s;
        }

        .hamburger:hover div {
            background-color: transparent;
        }

        .hamburger:hover div:nth-child(1) {
            transform: translateY(5px) rotate(45deg);
        }

        .hamburger:hover div:nth-child(2) {
            opacity: 0;
        }

        .hamburger:hover div:nth-child(3) {
            transform: translateY(-5px) rotate(-45deg);
        }

        .sidebar {
            width: 0;
            height: 100%;
            background-color: #333;
            overflow-x: hidden;
            transition: width 0.5s; /* Adjust the transition property */
            position: fixed;
            z-index: 1;
            margin-top: 60px; /* Add margin to create space for the button */
        }

        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 20px;
            color: #fff;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            color: #00bcd4;
        }

        .content-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            margin-left: 60px; /* Adjust as needed to create space for the sidebar button */
        }

        .content {
            flex: 1;
            padding: 20px;
            filter: blur(0); /* Initialize with no blur */
        }

        /* Add overlay class for the black overlay */
        .overlay {
            position: fixed;
            width: 100%; /* Make the overlay cover the full width of the screen */
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Black with 50% opacity */
            z-index: 0;
            display: none;
            transition: width 0.5s ease-in-out; /* Transition for overlay width */
            transform-origin: left; /* Set the transform origin to the left side */
        }

        /* Add overlay-right class for the remaining 50% of the sidebar */
        .overlay-right {
            position: fixed;
            width: 0; /* Initialize with no width */
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Black with 50% opacity */
            z-index: 0;
            display: none;
            transition: width 0.5s ease-in-out; /* Transition for overlay width */
            transform-origin: right; /* Set the transform origin to the right side */
        }

        /* Adjust the display property and width when the sidebar is expanded */
        .sidebar.change {
            width: 50%; /* Set the sidebar to 50% of the screen width */
        }

        .overlay.change {
            display: block;
            width: 100%; /* Make the overlay cover the full width of the screen */
            transform: scaleX(1); /* Scale the overlay to cover the screen */
        }

        /* Show the overlay for the remaining 50% of the sidebar when expanded */
        .sidebar.change + .overlay-right {
            display: block;
            width: 100%; /* Make the overlay cover the full width of the screen */
            transform: scaleX(1); /* Scale */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hamburger-container">
            <div class="hamburger" onclick="toggleSidebar()">
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
        <!-- Move the sidebar below the hamburger button -->
        <div class="sidebar" id="mySidebar">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
        <div class="content-container">
            <div class="content" id="content">
                <h1>Main Content</h1>
                <p>This is the main content of your page.</p>
            </div>
        </div>
    </div>

    <!-- Add an overlay element for the remaining 50% of the sidebar -->
    <div class="overlay-right" id="overlay-right"></div>

    <!-- Add an overlay element for the expanded sidebar -->
    <div class="overlay" id="overlay"></div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById("mySidebar");
            const overlay = document.getElementById("overlay");
            const overlayRight = document.getElementById("overlay-right");

            sidebar.classList.toggle("change");
            overlay.classList.toggle("change");
            overlayRight.classList.toggle("change");
        }
    </script>
</body>
</html>
